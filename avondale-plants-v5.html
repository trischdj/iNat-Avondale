<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avondale Plant Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --gd:#1a3d20;--gm:#2e6b3e;--gl:#4a9960;--gp:#d4edda;
  --am:#c17900;--rd:#b03030;--bl:#1a6fa0;
  --ink:#1c2b1e;--stone:#6b7c6d;--paper:#f7f9f5;
  --white:#fff;--border:#dce8dc;
  --sh:0 2px 10px rgba(26,61,32,.09);--shl:0 6px 28px rgba(26,61,32,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}

header{background:var(--gd);color:#fff;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 16px rgba(0,0,0,.28)}
.hico{width:36px;height:36px;background:var(--gl);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.htxt h1{font-family:'DM Serif Display',serif;font-size:1.2rem;letter-spacing:-.01em}
.htxt p{font-size:.72rem;opacity:.6;margin-top:1px}
.hl{display:flex;align-items:center;gap:12px}
.tabs{display:flex;gap:3px;background:rgba(255,255,255,.1);border-radius:9px;padding:3px}
.tab{padding:5px 14px;border-radius:7px;border:none;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);transition:all .15s}
.tab.on{background:#fff;color:var(--gd);font-weight:600}
.tab:hover:not(.on){background:rgba(255,255,255,.15);color:#fff}

/* LOAD PROGRESS OVERLAY */
.load-overlay{position:fixed;inset:0;background:var(--gd);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2000;gap:20px;transition:opacity .5s}
.load-overlay.done{opacity:0;pointer-events:none}
.load-logo{font-size:3rem}
.load-title{font-family:'DM Serif Display',serif;font-size:1.6rem;color:#fff}
.load-sub{font-size:.85rem;color:rgba(255,255,255,.6);margin-top:-12px}
.load-bar-wrap{width:280px;height:6px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}
.load-bar-fill{height:100%;background:var(--gl);border-radius:10px;width:0;transition:width .3s ease}
.load-status{font-size:.78rem;color:rgba(255,255,255,.5);min-height:1.2em;text-align:center}

.prog{height:3px;background:var(--border)}
.progf{height:3px;background:var(--gl);width:0;transition:width .25s}

.bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 28px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sbox{position:relative;flex:1;min-width:160px;max-width:260px}
.sbox input{width:100%;padding:7px 11px 7px 32px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.83rem;background:var(--paper);outline:none;transition:border .15s}
.sbox input:focus{border-color:var(--gm)}
.sbox::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:.8rem;pointer-events:none}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);font-family:'DM Sans',sans-serif;font-size:.76rem;font-weight:500;cursor:pointer;background:#fff;color:var(--stone);display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap}
.pill:hover{border-color:var(--gm);color:var(--gm)}
.pill.on-native{background:var(--gd);border-color:var(--gd);color:#fff}
.pill.on-nonnative{background:#7a5800;border-color:#7a5800;color:#fff}
.pill.on-invasive{background:var(--rd);border-color:var(--rd);color:#fff}
.pill.on-noninvasive{background:var(--bl);border-color:var(--bl);color:#fff}
.pcnt{font-size:.68rem;padding:1px 5px;border-radius:10px;background:rgba(0,0,0,.12);min-width:16px;text-align:center}
.pill:not([class*="on-"]) .pcnt{background:var(--border);color:var(--stone)}
.tr{display:flex;gap:6px;margin-left:auto;align-items:center}
select.ss{padding:6px 9px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.8rem;background:var(--paper);outline:none;color:var(--ink)}
.ibtn{padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.8rem;font-family:'DM Sans',sans-serif;cursor:pointer;background:#fff;color:var(--stone);font-weight:500;transition:all .15s}
.ibtn:hover{border-color:var(--gm);color:var(--gm)}

.strip{background:var(--gd);color:rgba(255,255,255,.75);display:flex;gap:0;overflow-x:auto;font-size:.76rem;flex-shrink:0}
.si{padding:8px 18px;border-right:1px solid rgba(255,255,255,.1);white-space:nowrap;display:flex;align-items:center;gap:5px}
.si strong{color:#fff;font-size:.95rem;font-family:'DM Serif Display',serif}
.sd{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;padding:20px 28px}
.card{background:#fff;border-radius:13px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--border);display:flex;flex-direction:column;transition:transform .17s,box-shadow .17s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shl)}
.cimg{width:100%;height:160px;overflow:hidden;background:var(--gp);position:relative;display:flex;align-items:center;justify-content:center;font-size:2.8rem;flex-shrink:0}
.cimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .cimg img{transform:scale(1.05)}
.cbadges{position:absolute;top:7px;left:7px;display:flex;gap:3px;flex-wrap:wrap}
.mb{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:12px;backdrop-filter:blur(4px)}
.mb-n{background:rgba(20,55,25,.85);color:#b0f0c0}
.mb-nn{background:rgba(100,70,0,.85);color:#ffe090}
.mb-inv{background:rgba(160,35,35,.85);color:#ffd0d0}
.mb-ni{background:rgba(20,90,140,.85);color:#c8eaf5}
.cbody{padding:11px 13px 8px;flex:1}
.cn{font-weight:600;font-size:.93rem;line-height:1.3}
.cs{font-style:italic;font-size:.76rem;color:var(--stone);margin:2px 0 6px}
.cm{font-size:.72rem;color:#aaa;display:flex;gap:8px;flex-wrap:wrap}
.cfoot{padding:7px 13px 11px;display:flex;align-items:center;justify-content:space-between;gap:5px;border-top:1px solid #f0f4f0}
.cp{font-size:.66rem;font-weight:600;padding:2px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.cp-conf{background:#e4f5e8;color:#145c20}
.cp-inv{background:#fde8e8;color:#a02020}
.cp-nn{background:#fff0d8;color:#7a4a00}
.cp-unk{background:#f0f2f0;color:#888}
.src{font-size:.62rem;padding:2px 5px;border-radius:7px;background:#dbeafe;color:#1e40af}
.vl{font-size:.7rem;color:var(--gm);text-decoration:none;font-weight:500;white-space:nowrap;margin-left:auto}
.vl:hover{text-decoration:underline}

/* PAGINATION */
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:14px 28px 28px;font-size:.81rem;color:var(--stone)}
.pbtn{padding:6px 16px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;background:#fff;color:var(--ink);transition:all .15s}
.pbtn:hover:not(:disabled){border-color:var(--gm);color:var(--gm)}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.pnums{display:flex;gap:4px}
.pnum{padding:5px 10px;border:1.5px solid var(--border);border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.78rem;cursor:pointer;background:#fff;transition:all .15s}
.pnum.active{background:var(--gd);border-color:var(--gd);color:#fff;font-weight:600}
.pnum:hover:not(.active){border-color:var(--gm);color:var(--gm)}

/* MAP */
#tab-map{display:none;flex:1;position:relative}
#map{width:100%;height:calc(100vh - 64px - 3px - 52px - 36px);min-height:400px}
.mleg{position:absolute;bottom:20px;right:10px;background:#fff;border-radius:11px;box-shadow:var(--shl);padding:12px 14px;z-index:900;font-size:.76rem;min-width:180px;border:1px solid var(--border)}
.mleg h4{font-family:'DM Serif Display',serif;font-size:.9rem;margin-bottom:8px;color:var(--gd)}
.lr{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.lc{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(0,0,0,.15);flex-shrink:0}
.mip{position:absolute;top:10px;right:10px;background:#fff;border-radius:11px;box-shadow:var(--shl);padding:14px;z-index:900;max-width:270px;display:none;border:1px solid var(--border);font-size:.8rem;max-height:80vh;overflow-y:auto}
.mip h3{font-family:'DM Serif Display',serif;font-size:.95rem;margin-bottom:6px;color:var(--gd)}
.mip .xbtn{float:right;cursor:pointer;font-size:.95rem;color:var(--stone);background:none;border:none;margin-top:-2px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);gap:5px;font-size:.74rem}
.srow:last-child{border-bottom:none}
.ssci{font-style:italic;color:var(--stone);font-size:.68rem}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 28px;color:var(--stone);text-align:center;gap:10px}

.src-note{font-size:.7rem;color:var(--stone);padding:6px 28px 2px;font-style:italic}

@media(max-width:640px){
  header,.bar,.grid,.pager{padding-left:14px;padding-right:14px}
  .htxt p{display:none}
}
</style>
</head>
<body>

<!-- LOADING OVERLAY -->
<div class="load-overlay" id="overlay">
  <div class="load-logo">🌿</div>
  <div class="load-title">Avondale Plant Explorer</div>
  <div class="load-sub">Loading all observations…</div>
  <div class="load-bar-wrap"><div class="load-bar-fill" id="lbar"></div></div>
  <div class="load-status" id="lstatus">Connecting to iNaturalist…</div>
</div>

<header>
  <div class="hl">
    <div class="hico">🌿</div>
    <div class="htxt">
      <h1>Avondale Plant Explorer</h1>
      <p>Life in Avondale · iNaturalist + Midwest Native Plant Database</p>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="switchTab('list')">📋 Observations</button>
    <button class="tab" onclick="switchTab('map')">🗺 Biodiversity Map</button>
  </div>
</header>

<div class="prog"><div class="progf" id="pf"></div></div>

<div class="bar">
  <div class="sbox"><input type="text" id="si" placeholder="Search all species…" oninput="applyFilters()"></div>
  <div class="pills">
    <button class="pill" id="pn"  onclick="tog('native')">🌱 Native <span class="pcnt" id="cn">—</span></button>
    <button class="pill" id="pnn" onclick="tog('nonnative')">🌍 Non-native <span class="pcnt" id="cnn">—</span></button>
    <button class="pill" id="pi"  onclick="tog('invasive')">⚠️ Invasive <span class="pcnt" id="ci">—</span></button>
    <button class="pill" id="pni" onclick="tog('noninvasive')">✅ Non-invasive <span class="pcnt" id="cni">—</span></button>
  </div>
  <div class="tr">
    <select class="ss" id="sort" onchange="applyFilters()">
      <option value="date">Most Recent</option>
      <option value="name">Name A–Z</option>
      <option value="native">Natives First</option>
    </select>
    <button class="ibtn" onclick="exportCSV()">⬇ CSV</button>
  </div>
</div>

<div class="strip" id="strip"><div class="si"><span>Loading…</span></div></div>

<div id="tab-list">
  <p class="src-note" id="srcnote"></p>
  <div id="content"></div>
  <div class="pager" id="pgr"></div>
</div>

<div id="tab-map">
  <div id="map"></div>
  <div class="mleg">
    <h4>Nativity Score</h4>
    <div class="lr"><div class="lc" style="background:#1a7a2e"></div><span><strong>Native rich</strong></span></div>
    <div class="lr"><div class="lc" style="background:#56ab2f"></div><span><strong>Native majority</strong></span></div>
    <div class="lr"><div class="lc" style="background:#f9c74f"></div><span><strong>Mixed</strong></span></div>
    <div class="lr"><div class="lc" style="background:#f3722c"></div><span><strong>Non-native heavy</strong></span></div>
    <div class="lr"><div class="lc" style="background:#b83232"></div><span><strong>Invasive dominant</strong></span></div>
    <div class="lr" style="margin-top:6px"><div class="lc" style="background:#aaa;width:12px;height:12px"></div><span style="font-size:.7rem">Size = observation count</span></div>
  </div>
  <div class="mip" id="mip">
    <button class="xbtn" onclick="closeMip()">✕</button>
    <h3 id="mipT">Cluster</h3>
    <div id="mipB"></div>
  </div>
</div>

// ── Lookup ──────────────────────────────────────────────────────────
function lookup(sciName) {
  if (!sciName) return null;
  const key = sciName.toLowerCase().trim();
  if (PLANT_DB[key]) return PLANT_DB[key];
  const genus = key.split(' ')[0];
  if (PLANT_DB[genus]) return { ...PLANT_DB[genus], genusMatch: true };
  return null;
}
function classify(obs) {
  const rec = lookup(obs.taxon?.name);
  if (rec) return { native: rec.native, invasive: rec.invasive, genusMatch: rec.genusMatch||false, inDB: true };
  const em = obs.taxon?.establishment_means?.establishment_means;
  if (em === 'native')     return { native: true,  invasive: false, genusMatch: false, inDB: false };
  if (em === 'introduced') return { native: false, invasive: false, genusMatch: false, inDB: false };
  return { native: null, invasive: false, genusMatch: false, inDB: false };
}

// ── State ───────────────────────────────────────────────────────────
const PID = 'life-in-avondale-community';
const PAGE_SIZE = 48;
let allObs = [];          // ALL observations, fetched once
let filteredObs = [];     // result of current filter+sort
let viewPage = 1;         // current display page within filteredObs
let activeF = new Set();
let lmap, clayer, mapInited = false;

// ── LOAD ALL OBS ────────────────────────────────────────────────────
async function loadAll() {
  setLbar(5); setLstatus('Connecting to iNaturalist…');
  // First request to get total
  let fetched = [], totalObs = 0, pg = 1;
  try {
    const first = await fetch(`https://api.inaturalist.org/v1/observations?project_id=${PID}&taxon_id=47126&per_page=200&page=1&order=desc&order_by=observed_on&photos=true`);
    const fd = await first.json();
    totalObs = fd.total_results;
    fetched = fetched.concat(fd.results);
    setLstatus(`Fetched ${fetched.length} of ${totalObs}…`);
    setLbar(Math.round(10 + 85 * fetched.length / totalObs));

    // Fetch remaining pages in parallel batches of 4
    const totalPages = Math.ceil(totalObs / 200);
    const pages = [];
    for (let p = 2; p <= totalPages; p++) pages.push(p);

    for (let i = 0; i < pages.length; i += 4) {
      const batch = pages.slice(i, i + 4);
      const results = await Promise.all(batch.map(p =>
        fetch(`https://api.inaturalist.org/v1/observations?project_id=${PID}&taxon_id=47126&per_page=200&page=${p}&order=desc&order_by=observed_on&photos=true`)
          .then(r => r.json()).then(d => d.results).catch(() => [])
      ));
      results.forEach(r => fetched = fetched.concat(r));
      setLstatus(`Fetched ${fetched.length} of ${totalObs}…`);
      setLbar(Math.round(10 + 85 * Math.min(fetched.length, totalObs) / totalObs));
    }
  } catch(e) {
    setLstatus('Error: ' + e.message);
    return;
  }

  allObs = fetched;
  setLbar(100);
  setLstatus(`Loaded ${allObs.length} observations ✓`);
  setTimeout(() => {
    document.getElementById('overlay').classList.add('done');
    applyFilters();
    updateCounts();
    document.getElementById('srcnote').textContent =
      `Showing all ${allObs.length.toLocaleString()} observations. Nativity from embedded Midwest Native Plant Database (Ohio Invasive Plants Council + USDA PLANTS).`;
  }, 400);
}

// ── Tabs ────────────────────────────────────────────────────────────
function switchTab(t) {
  document.querySelectorAll('.tab').forEach((b,i) => b.classList.toggle('on', ['list','map'][i] === t));
  document.getElementById('tab-list').style.display = t === 'list' ? 'block' : 'none';
  document.getElementById('tab-map').style.display  = t === 'map'  ? 'flex'  : 'none';
  if (t === 'map') {
    if (!mapInited) { initMap(); mapInited = true; }
    renderMap();
  }
}

// ── Filter pills ────────────────────────────────────────────────────
function tog(f) {
  activeF.has(f) ? activeF.delete(f) : activeF.add(f);
  const ids = {native:'pn', nonnative:'pnn', invasive:'pi', noninvasive:'pni'};
  document.getElementById(ids[f]).className = 'pill' + (activeF.has(f) ? ' on-'+f : '');
  applyFilters();
}

// ── Filter + sort across ALL obs ─────────────────────────────────────
function applyFilters() {
  const q    = document.getElementById('si').value.toLowerCase();
  const sort = document.getElementById('sort').value;

  filteredObs = allObs.filter(o => {
    const cm = (o.taxon?.preferred_common_name || '').toLowerCase();
    const sc = (o.taxon?.name || '').toLowerCase();
    if (q && !cm.includes(q) && !sc.includes(q)) return false;
    if (activeF.size === 0) return true;
    const { native, invasive } = classify(o);
    if (activeF.has('native')      && native === true)  return true;
    if (activeF.has('nonnative')   && native === false) return true;
    if (activeF.has('invasive')    && invasive)         return true;
    if (activeF.has('noninvasive') && !invasive)        return true;
    return false;
  });

  // Sort
  if (sort === 'name') {
    filteredObs.sort((a,b) => (a.taxon?.preferred_common_name||'').localeCompare(b.taxon?.preferred_common_name||''));
  } else if (sort === 'native') {
    const score = o => { const {native,invasive} = classify(o); return invasive ? -1 : native ? 2 : native===false ? 0 : 1; };
    filteredObs.sort((a,b) => score(b) - score(a));
  }
  // 'date' keeps iNaturalist's default desc order

  viewPage = 1;
  renderView();
}

function updateCounts() {
  let n=0, nn=0, inv=0, ni=0;
  allObs.forEach(o => {
    const { native, invasive } = classify(o);
    if (native === true)  n++;
    if (native === false) nn++;
    if (invasive)         inv++;
    if (!invasive)        ni++;
  });
  document.getElementById('cn').textContent  = n.toLocaleString();
  document.getElementById('cnn').textContent = nn.toLocaleString();
  document.getElementById('ci').textContent  = inv.toLocaleString();
  document.getElementById('cni').textContent = ni.toLocaleString();
}

// ── Render current view page ─────────────────────────────────────────
function renderView() {
  const totalPages = Math.ceil(filteredObs.length / PAGE_SIZE);
  const start = (viewPage - 1) * PAGE_SIZE;
  const slice = filteredObs.slice(start, start + PAGE_SIZE);

  // Stats strip
  const n   = filteredObs.filter(o => classify(o).native === true).length;
  const nn  = filteredObs.filter(o => classify(o).native === false).length;
  const inv = filteredObs.filter(o => classify(o).invasive).length;
  document.getElementById('strip').innerHTML = `
    <div class="si">Filtered <strong>${filteredObs.length.toLocaleString()}</strong> / ${allObs.length.toLocaleString()} total</div>
    <div class="si"><div class="sd" style="background:var(--gl)"></div><strong>${n.toLocaleString()}</strong> native</div>
    <div class="si"><div class="sd" style="background:var(--am)"></div><strong>${nn.toLocaleString()}</strong> non-native</div>
    <div class="si"><div class="sd" style="background:var(--rd)"></div><strong>${inv.toLocaleString()}</strong> invasive</div>
    <div class="si">Page ${viewPage} of ${totalPages||1}</div>`;

  // Cards
  if (!slice.length) {
    document.getElementById('content').innerHTML = '<div class="empty"><p>🌱 No observations match these filters.</p></div>';
    document.getElementById('pgr').innerHTML = '';
    return;
  }

  document.getElementById('content').innerHTML = '<div class="grid">' + slice.map(o => {
    const { native, invasive, genusMatch, inDB } = classify(o);
    const photo = o.photos?.[0];
    const img = photo ? `<img src="${photo.url.replace('square','small')}" alt="" loading="lazy">` : '🌿';
    const cn = o.taxon?.preferred_common_name || 'Unknown Plant';
    const sc = o.taxon?.name || '';
    const dt = o.observed_on ? new Date(o.observed_on+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
    const pl = o.place_guess || '';
    const url = 'https://www.inaturalist.org/observations/'+o.id;

    let bgs = '';
    if (native === true)  bgs += '<span class="mb mb-n">Native</span>';
    if (native === false) bgs += '<span class="mb mb-nn">Non-native</span>';
    if (invasive)         bgs += '<span class="mb mb-inv">Invasive</span>';
    if (!invasive && native !== null) bgs += '<span class="mb mb-ni">Non-invasive</span>';

    let cpCls, cpLbl;
    if (invasive)           { cpCls='cp-inv';  cpLbl='⚠ Invasive'; }
    else if (native===true) { cpCls='cp-conf'; cpLbl = genusMatch ? '✓ Native (genus)' : '✓ Native'; }
    else if (native===false){ cpCls='cp-nn';   cpLbl='Non-native'; }
    else                    { cpCls='cp-unk';  cpLbl='Unverified'; }

    const srcTag = inDB
      ? '<span class="src">DB</span>'
      : (native !== null ? '<span class="src" style="background:#d1fae5;color:#065f46">iNat</span>' : '');

    return `<div class="card">
      <div class="cimg">${img}<div class="cbadges">${bgs}</div></div>
      <div class="cbody">
        <div class="cn">${cn}</div>
        <div class="cs">${sc}</div>
        <div class="cm">${dt?`<span>📅 ${dt}</span>`:''}${pl?`<span>📍 ${pl}</span>`:''}</div>
      </div>
      <div class="cfoot">
        <span class="cp ${cpCls}">${cpLbl}</span>
        ${srcTag}
        <a class="vl" href="${url}" target="_blank" rel="noopener">View →</a>
      </div>
    </div>`;
  }).join('') + '</div>';

  // Pager
  renderPager(totalPages);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function renderPager(totalPages) {
  if (totalPages <= 1) { document.getElementById('pgr').innerHTML = ''; return; }
  let nums = '';
  const range = 2;
  for (let p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || (p >= viewPage - range && p <= viewPage + range)) {
      nums += `<button class="pnum${p===viewPage?' active':''}" onclick="goPage(${p})">${p}</button>`;
    } else if (p === viewPage - range - 1 || p === viewPage + range + 1) {
      nums += `<span style="padding:0 4px;color:var(--stone)">…</span>`;
    }
  }
  document.getElementById('pgr').innerHTML =
    `<button class="pbtn" onclick="goPage(${viewPage-1})" ${viewPage===1?'disabled':''}>← Prev</button>
     <div class="pnums">${nums}</div>
     <button class="pbtn" onclick="goPage(${viewPage+1})" ${viewPage>=totalPages?'disabled':''}>Next →</button>`;
}

function goPage(p) {
  const tp = Math.ceil(filteredObs.length / PAGE_SIZE);
  if (p < 1 || p > tp) return;
  viewPage = p;
  renderView();
}

// ── MAP ──────────────────────────────────────────────────────────────
function initMap() {
  lmap = L.map('map').setView([39.115,-84.515],14);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'© OpenStreetMap © CARTO', maxZoom:19
  }).addTo(lmap);
}

function renderMap() {
  if (clayer) lmap.removeLayer(clayer);
  clayer = L.layerGroup().addTo(lmap);
  const src = allObs.filter(o => o.geojson);
  const cells = {};
  src.forEach(o => {
    const [lng,lat] = o.geojson.coordinates;
    const k = `${Math.round(lat*300)/300},${Math.round(lng*300)/300}`;
    if (!cells[k]) cells[k] = {lat:Math.round(lat*300)/300, lng:Math.round(lng*300)/300, obs:[]};
    cells[k].obs.push(o);
  });
  Object.values(cells).forEach(cell => {
    let nat=0, inv=0;
    const sp = {};
    cell.obs.forEach(o => {
      const {native, invasive} = classify(o);
      if (native)  nat++;
      if (invasive) inv++;
      const k = o.taxon?.name||'Unknown';
      if (!sp[k]) sp[k]={common:o.taxon?.preferred_common_name||k,sci:k,native,invasive,count:0};
      sp[k].count++;
    });
    const tot = cell.obs.length;
    const nr = tot ? nat/tot : 0, ir = tot ? inv/tot : 0;
    const color = ir>.4?'#b83232': nr>.75?'#1a7a2e': nr>.5?'#56ab2f': nr>.25?'#f9c74f': nr>0?'#f3722c':'#b83232';
    const radius = Math.max(9, Math.min(34, 7+Math.sqrt(tot)*4));
    const dk = (h=>{const n=parseInt(h.slice(1),16);const r=Math.max(0,(n>>16)-25),g=Math.max(0,((n>>8)&0xff)-25),b=Math.max(0,(n&0xff)-25);return'#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0')})(color);
    const m = L.circleMarker([cell.lat,cell.lng],{radius,fillColor:color,color:dk,weight:1.5,opacity:.9,fillOpacity:.8}).addTo(clayer);
    m.bindTooltip(`<strong>${tot}</strong> obs · ${nat} native · ${inv} invasive`,{sticky:true});
    m.on('click',()=>showMip(tot,nat,inv,Object.values(sp)));
  });
}

function showMip(total,nat,inv,sp) {
  document.getElementById('mip').style.display='block';
  document.getElementById('mipT').textContent=total+' observation'+(total!==1?'s':'');
  const sorted=[...sp].sort((a,b)=>b.count-a.count).slice(0,14);
  document.getElementById('mipB').innerHTML=
    `<div style="display:flex;gap:10px;margin-bottom:8px;font-size:.76rem;flex-wrap:wrap">
       <span style="color:#1a7a2e;font-weight:600">🌱 ${nat} native</span>
       <span style="color:#b83232;font-weight:600">⚠ ${inv} invasive</span>
       <span style="color:#888">${total-nat} non-native / unverified</span>
     </div>
     <div style="font-weight:600;font-size:.75rem;color:#666;margin-bottom:4px">Species:</div>`+
    sorted.map(s=>{
      const tag=s.invasive?'<span style="font-size:.62rem;color:#b83232">invasive</span>':
                s.native?'<span style="font-size:.62rem;color:#1a7a2e">native</span>':
                '<span style="font-size:.62rem;color:#aaa">non-native</span>';
      return `<div class="srow"><div><div>${s.common}</div><div class="ssci">${s.sci}</div></div>
              <div style="text-align:right">${tag}<br><span style="font-size:.68rem;color:#ccc">${s.count}×</span></div></div>`;
    }).join('');
}
function closeMip(){document.getElementById('mip').style.display='none';}

// ── Utils ────────────────────────────────────────────────────────────
function setP(v){document.getElementById('pf').style.width=v+'%';}
function setLbar(v){document.getElementById('lbar').style.width=v+'%';}
function setLstatus(t){document.getElementById('lstatus').textContent=t;}

function exportCSV() {
  if (!filteredObs.length) return alert('No data loaded yet.');
  const rows=[['Common Name','Scientific Name','Date','Place','Native','Invasive','In DB','URL']];
  filteredObs.forEach(o=>{
    const {native,invasive,inDB}=classify(o);
    rows.push([
      o.taxon?.preferred_common_name||'', o.taxon?.name||'',
      o.observed_on||'', o.place_guess||'',
      native===true?'Yes':native===false?'No':'Unknown',
      invasive?'Yes':'No', inDB?'Yes':'No',
      'https://www.inaturalist.org/observations/'+o.id
    ]);
  });
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='avondale-plants.csv'; a.click();
}

// ── Boot ─────────────────────────────────────────────────────────────
loadAll();
</script>
